<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password - DeskOS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="reset-container">

    <h1>Reset your password</h1>

    <p>Enter a new password for your DeskOS account.</p>

    <input
      type="password"
      id="newPassword"
      placeholder="New password"
      autocomplete="new-password"
    >

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm new password"
      autocomplete="new-password"
    >

    <button id="updatePasswordButton" onclick="updatePassword()">
      Update Password
    </button>

    <p id="passwordMessage"></p>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your Supabase configuration -->
  <script src="data.js"></script>

  <script>
    async function updatePassword() {

      const password =
        document.getElementById("newPassword").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      const message =
        document.getElementById("passwordMessage");

      const button =
        document.getElementById("updatePasswordButton");


      if (!password || !confirmPassword) {
        message.textContent =
          "Please fill in both password fields.";
        return;
      }


      if (password.length < 6) {
        message.textContent =
          "Your password must be at least 6 characters.";
        return;
      }


      if (password !== confirmPassword) {
        message.textContent =
          "The passwords do not match.";
        return;
      }


      button.disabled = true;
      button.textContent = "Updating...";


      try {

        const { data, error } =
          await supabase.auth.updateUser({
            password: password
          });


        if (error) {
          throw error;
        }


        message.textContent =
          "Password updated successfully!";


        button.textContent = "Password Updated";


        setTimeout(() => {
          window.location.href = "login.html";
        }, 2000);


      } catch (error) {

        console.error(error);

        message.textContent =
          "Unable to update your password. The reset link may have expired.";

        button.disabled = false;
        button.textContent = "Update Password";
      }
    }
  </script>

</body>
</html>
